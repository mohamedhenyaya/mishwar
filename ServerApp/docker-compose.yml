services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vtc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vtc_db}
      POSTGRES_USER: ${DB_USERNAME:-vtc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vtc_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vtc_user} -d ${DB_NAME:-vtc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: